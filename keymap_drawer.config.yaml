draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: auto
  n_columns: 2  # 1 column looks best for Totem (tall and thin)
  separate_combo_diagrams: true
  footer_text: "Totem Layout"

parse_config:
  trans_legend: {t: ""}
  zmk_behavior_map:
      lt_custom: lt
      sk_custom: sk
      mt_shift: mt  
  
  # 1. Map your custom behaviors to readable text
  raw_binding_map:
    "&bootloader": Boot
    "&caps_word": Caps Word
    "&sys_reset": Reset

    # Map the Bluetooth keys to short names
    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4
    "&bt BT_CLR": BT Clr

    # Map your Shortcuts (Nav Layer)
    "&kp LC(C)": Copy
    "&kp LC(V)": Paste
    "&kp LC(X)": Cut
    "&kp LC(Z)": Undo

    # US-Intl Symbols (so they show as the symbol, not the code)
    "&kp RA(Q)": Ä
    "&kp RA(P)": Ö
    "&kp RA(Y)": Ü
    "&kp RA(N)": ñ
    "&kp RA(S)": ß

  # 2. Make the standard keys look pretty (Icons & Short names)
  zmk_keycode_map:
    # Modifiers
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    
    # Common Keys
    BSPC: ⌫
    DEL: ⌦
    ESC: Esc
    RET: ⏎
    SPACE: ␣
    TAB: ⇥
    
    # Navigation
    PG_UP: PgUp
    PG_DN: PgDn
    HOME: Home
    END: End
    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →
    
    # Media Icons (SVG paths)
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_BRI_UP: $$mdi:brightness-5$$
    C_BRI_DN: $$mdi:brightness-7$$
    C_PP: $$mdi:play-pause$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$
    F20: $$mdi:microphone-off$$  
    
    # Symbols
    EXCL: "!"
    AT: "@"
    HASH: "#"
    DLLR: "$"
    PRCNT: "%"
    CARET: "^"
    AMPS: "&"
    ASTRK: "*"
    LPAR: "("
    RPAR: ")"
    MINUS: "-"
    PLUS: "+"
    EQUAL: "="
    LBKT: "["
    RBKT: "]"
    LBRC: "{"
    RBRC: "}"
    SEMI: ";"
    COLON: ":"
    SQT: "'"
    DQT: '"'
    GRAVE: "`"
    TILDE: "~"
    BSLH: "\\"
    PIPE: "|"
    GT: ">"
    LT: "<"
    QMARK: "?"
    FSLH: "/"
    UNDER: "_"
    COMMA: ","
    DOT: "."